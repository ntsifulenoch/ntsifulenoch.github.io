# Builds the website, and the CV PDF from cv/resume_ntsiful.tex, on every push to master
# (including edits made directly on github.com).
# While the repository is private the site is only built, as a check. Once the repository
# is public, the same run also deploys it to https://ntsifulenoch.github.io
name: Build and deploy site

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish; skip runs queued behind it
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Compile the CV (cv/resume_ntsiful.tex)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: cv
          root_file: resume_ntsiful.tex

      - name: Publish the freshly compiled CV
        run: cp cv/resume_ntsiful.pdf files/Enoch_Ntsiful_CV.pdf

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 0

      - name: Configure GitHub Pages
        id: pages
        if: ${{ !github.event.repository.private }}
        uses: actions/configure-pages@v6.0.0

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload GitHub Pages artifact
        if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    if: ${{ !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
